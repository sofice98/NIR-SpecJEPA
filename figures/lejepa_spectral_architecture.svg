<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#334155"/></marker>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/></marker>
    <style>
      .title{font:700 28px Arial;fill:#0f172a}.stage{font:700 22px Arial;fill:#0f172a}
      .head{font:700 17px Arial;fill:#0f172a}.txt{font:14px Arial;fill:#334155}.dim{font:700 14px Consolas;fill:#0f766e}
      .box{stroke:#64748b;stroke-width:2;rx:14}.arrow{stroke:#334155;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .red{stroke:#dc2626;stroke-width:2.5;fill:none;marker-end:url(#redarrow)}
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#f8fafc"/>
  <text x="800" y="42" text-anchor="middle" class="title">LeJEPA for One-Dimensional Crude-Oil Infrared Spectra</text>

  <rect x="28" y="65" width="1544" height="575" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="55" y="100" class="stage">LeJEPA self-supervised pretraining (no property labels)</text>

  <rect class="box" x="55" y="245" width="180" height="125" fill="#dbeafe"/>
  <text x="145" y="275" text-anchor="middle" class="head">Unified spectrum</text>
  <path d="M75 325 C95 290,115 350,135 310 S175 290,215 335" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="145" y="348" text-anchor="middle" class="dim">x: [B, 517]</text>
  <text x="145" y="365" text-anchor="middle" class="txt">4011–11972 cm⁻¹</text>

  <path class="arrow" d="M235 308 H275"/>
  <rect class="box" x="275" y="220" width="205" height="175" fill="#e0f2fe"/>
  <text x="377" y="252" text-anchor="middle" class="head">1D patchify</text>
  <text x="377" y="280" text-anchor="middle" class="txt">patch_size = 6 points</text>
  <text x="377" y="302" text-anchor="middle" class="txt">≈ 92.6 cm⁻¹</text>
  <text x="377" y="330" text-anchor="middle" class="txt">pad 517 → 522</text>
  <text x="377" y="352" text-anchor="middle" class="txt">87 patches</text>
  <text x="377" y="378" text-anchor="middle" class="dim">[B, 87, 6]</text>

  <path class="arrow" d="M480 270 H525"/><path class="arrow" d="M480 350 H525"/>
  <rect class="box" x="525" y="145" width="220" height="175" fill="#ffedd5"/>
  <text x="635" y="175" text-anchor="middle" class="head">View 1 block mask</text>
  <text x="635" y="203" text-anchor="middle" class="txt">mask_ratio = 40%</text>
  <text x="635" y="227" text-anchor="middle" class="txt">block = 4 patches</text>
  <text x="635" y="249" text-anchor="middle" class="txt">≈ 370 cm⁻¹</text>
  <text x="635" y="276" text-anchor="middle" class="dim">m₁: [B, 87]</text>
  <text x="635" y="299" text-anchor="middle" class="txt">learnable mask token</text>
  <rect class="box" x="525" y="350" width="220" height="175" fill="#ffedd5"/>
  <text x="635" y="380" text-anchor="middle" class="head">View 2 block mask</text>
  <text x="635" y="408" text-anchor="middle" class="txt">mask_ratio = 40%</text>
  <text x="635" y="432" text-anchor="middle" class="txt">block = 4 patches</text>
  <text x="635" y="454" text-anchor="middle" class="txt">≈ 370 cm⁻¹</text>
  <text x="635" y="481" text-anchor="middle" class="dim">m₂: [B, 87]</text>
  <text x="635" y="504" text-anchor="middle" class="txt">learnable mask token</text>

  <path class="arrow" d="M745 232 H785"/><path class="arrow" d="M745 438 H785"/>
  <rect class="box" x="785" y="132" width="265" height="405" fill="#dcfce7"/>
  <text x="917" y="165" text-anchor="middle" class="head">Shared encoder fθ</text>
  <text x="917" y="192" text-anchor="middle" class="txt">Linear patch projection</text>
  <text x="917" y="214" text-anchor="middle" class="dim">6 → 64</text>
  <text x="917" y="247" text-anchor="middle" class="txt">fixed sinusoidal position</text>
  <text x="917" y="269" text-anchor="middle" class="dim">[1, 87, 64]</text>
  <rect x="820" y="295" width="195" height="88" rx="10" fill="#bbf7d0" stroke="#16a34a"/>
  <text x="917" y="323" text-anchor="middle" class="head">2 × TransformerEncoder</text>
  <text x="917" y="348" text-anchor="middle" class="txt">2 heads · FFN 128</text>
  <text x="917" y="371" text-anchor="middle" class="txt">GELU · LayerNorm</text>
  <text x="917" y="415" text-anchor="middle" class="dim">tokens: [B, 87, 64]</text>
  <text x="917" y="445" text-anchor="middle" class="txt">visible-token mean pooling</text>
  <text x="917" y="475" text-anchor="middle" class="dim">h₁, h₂: [B, 64]</text>
  <text x="917" y="510" text-anchor="middle" class="txt">same weights for both views</text>

  <path class="arrow" d="M1050 335 H1090"/>
  <rect class="box" x="1090" y="225" width="205" height="215" fill="#ede9fe"/>
  <text x="1192" y="257" text-anchor="middle" class="head">Shared projector hφ</text>
  <text x="1192" y="292" text-anchor="middle" class="dim">64 → 128</text>
  <text x="1192" y="320" text-anchor="middle" class="txt">GELU</text>
  <text x="1192" y="350" text-anchor="middle" class="dim">128 → 16</text>
  <text x="1192" y="386" text-anchor="middle" class="dim">z₁,z₂: [B,16]</text>
  <text x="1192" y="416" text-anchor="middle" class="dim">Z: [2,B,16]</text>

  <path class="arrow" d="M1295 335 H1330"/>
  <rect class="box" x="1330" y="145" width="215" height="380" fill="#fee2e2"/>
  <text x="1437" y="178" text-anchor="middle" class="head">LeJEPA objective</text>
  <text x="1437" y="216" text-anchor="middle" class="head">View alignment MSE</text>
  <text x="1437" y="242" text-anchor="middle" class="txt">L_inv = mean</text>
  <text x="1437" y="263" text-anchor="middle" class="txt">||zᵥ − meanᵥ(z)||²</text>
  <line x1="1360" y1="285" x2="1515" y2="285" stroke="#fca5a5"/>
  <text x="1437" y="318" text-anchor="middle" class="head">SIGReg</text>
  <text x="1437" y="344" text-anchor="middle" class="txt">256 random projections</text>
  <text x="1437" y="367" text-anchor="middle" class="txt">17 knots</text>
  <text x="1437" y="410" text-anchor="middle" class="dim">L = 0.98 L_inv</text>
  <text x="1437" y="433" text-anchor="middle" class="dim">+ 0.02 L_SIGReg</text>
  <text x="1437" y="475" text-anchor="middle" class="txt">No EMA teacher</text>
  <text x="1437" y="496" text-anchor="middle" class="txt">No stop-gradient · No predictor</text>
  <path class="red" d="M1430 525 C1380 595,1030 605,920 540"/>
  <text x="1190" y="595" text-anchor="middle" fill="#dc2626" font-family="Arial" font-size="14" font-weight="700">backpropagation updates encoder and projector</text>

  <rect x="28" y="665" width="1544" height="305" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="55" y="702" class="stage">Frozen representation evaluation</text>
  <rect class="box" x="60" y="755" width="175" height="100" fill="#dbeafe"/>
  <text x="147" y="788" text-anchor="middle" class="head">Complete spectrum</text><text x="147" y="822" text-anchor="middle" class="dim">[B, 517]</text>
  <path class="arrow" d="M235 805 H285"/>
  <rect class="box" x="285" y="745" width="220" height="120" fill="#dcfce7"/>
  <text x="395" y="778" text-anchor="middle" class="head">Frozen encoder fθ</text><text x="395" y="810" text-anchor="middle" class="dim">tokens: [B,87,64]</text><text x="395" y="839" text-anchor="middle" fill="#dc2626" font-family="Arial" font-size="14" font-weight="700">gradient ✕</text>
  <path class="arrow" d="M505 805 H555"/>
  <rect class="box" x="555" y="755" width="190" height="100" fill="#ccfbf1"/>
  <text x="650" y="788" text-anchor="middle" class="head">Mean pooling</text><text x="650" y="822" text-anchor="middle" class="dim">representation [B,64]</text>
  <path class="arrow" d="M745 805 H795"/>
  <rect class="box" x="795" y="745" width="235" height="120" fill="#fef3c7"/>
  <text x="912" y="780" text-anchor="middle" class="head">Ridge regression</text><text x="912" y="810" text-anchor="middle" class="txt">α selected inside training fold</text><text x="912" y="840" text-anchor="middle" class="dim">ŷ: [B,3]</text>
  <path class="arrow" d="M1030 805 H1080"/>
  <rect class="box" x="1080" y="730" width="185" height="65" fill="#fce7f3"/><text x="1172" y="770" text-anchor="middle" class="head">Density [kg/m³]</text>
  <rect class="box" x="1080" y="805" width="185" height="65" fill="#fce7f3"/><text x="1172" y="845" text-anchor="middle" class="head">Sulfur content</text>
  <rect class="box" x="1080" y="880" width="185" height="65" fill="#fce7f3"/><text x="1172" y="920" text-anchor="middle" class="head">Residual carbon</text>

  <rect x="1300" y="735" width="235" height="205" rx="14" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="1417" y="765" text-anchor="middle" class="head">Matched MAE comparison</text>
  <text x="1320" y="797" class="txt">Same encoder and initialization</text><text x="1320" y="823" class="txt">Same masks and batch order</text><text x="1320" y="849" class="txt">Same data and epochs</text><text x="1320" y="875" class="txt">Same optimizer and Ridge</text><text x="1320" y="907" class="txt">Only objective/head differs</text>
</svg>
